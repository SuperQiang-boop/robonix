# Get the robot's URDF + high-level metadata. Single source of truth
# for "what does this robot look like, geometrically and physically" —
# replaces hardcoded URDF paths in nav2 / World viz / collision
# monitors. Loaded once at robotdesc startup; cached on the wire.
[contract]
id      = "robonix/system/robotdesc/description"
version = "1"
kind    = "service"
idl     = "robotdesc/srv/GetDescription.srv"
description = "Return the robot body description, including URDF and high-level metadata."

[mode]
type = "rpc"
