# Static mount transforms for every sensor declared in the URDF.
# Replaces the per-primitive `primitive/<area>/extrinsics` pattern —
# robotdesc owns the kinematic chain, primitives just publish data
# streams. World's camera-to-world projection consumes this to skip
# the tf2 side-channel entirely; multi-camera fusion does the same.
#
# Optional `sensor_kind` filter ("camera" / "lidar" / "imu" / "" = all).
[contract]
id      = "robonix/system/robotdesc/sensor_extrinsics"
version = "1"
kind    = "service"
idl     = "robotdesc/srv/GetSensorExtrinsics.srv"
description = "Return static sensor mount transforms from the robot body model."

[mode]
type = "rpc"
