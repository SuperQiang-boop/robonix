# World MCP server — Jetson + DOCKER deployment target.
#
#   build → RBNX_BUILD_TARGET=jetson-docker scripts/build.sh: docker build
#           with docker/Dockerfile.jetson (NVIDIA L4T PyTorch base, so torch +
#           CUDA come from the image instead of host-cu128 x86 wheels).
#   start → ROBONIX_WORLD_FORCE=docker scripts/start.sh: docker run with the
#           NVIDIA container runtime for GPU passthrough.
#
# Use this on a Jetson when you want a self-contained image (no host ROS /
# torch needed). Heavier first build than jetson-native; see the World README.
manifestVersion: 1

package:
  name: com.robonix.system.world
  version: 0.1.0
  vendor: robonix
  description: World — semantic + geometric live map (Jetson + docker / L4T target).
  license: MulanPSL-2.0

build: RBNX_BUILD_TARGET=jetson-docker bash scripts/build.sh
start: ROBONIX_WORLD_FORCE=docker bash scripts/start.sh

capabilities:
  - name: robonix/system/world/list_objects
  - name: robonix/system/world/get_robot_context
  - name: robonix/system/world/list_regions
  - name: robonix/system/world/goal_near
  - name: robonix/system/world/goal_room
  - name: robonix/system/world/get_scene_graph
  - name: robonix/system/world/get_object_context
  - name: robonix/system/world/list_relations
