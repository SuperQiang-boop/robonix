# World MCP server — Jetson + NATIVE host-ROS2 deployment target.
#
#   build → RBNX_BUILD_TARGET=jetson-native scripts/build.sh: no docker.
#           Creates rbnx-build/venv (--system-site-packages) and pip-installs
#           only the light pure-python deps; torch / torchvision / ultralytics /
#           open3d come from the host JetPack stack (see the World README
#           "Jetson native prerequisites" for how to install them).
#   start → ROBONIX_WORLD_FORCE=native scripts/start.sh → start_native.sh:
#           runs world_service on the host python, sharing the host RMW so it
#           sees the live camera/pointcloud topics the other host nodes publish.
#
# Use this on a Jetson whose host already has ROS 2 Humble + a CUDA-enabled
# python (the common JetPack setup). For a self-contained image instead, use
# package_manifest.jetson-docker.yaml.
manifestVersion: 1

package:
  name: com.robonix.system.world
  version: 0.1.0
  vendor: robonix
  description: World — semantic + geometric live map (Jetson + native host-ROS2 target).
  license: MulanPSL-2.0

build: RBNX_BUILD_TARGET=jetson-native bash scripts/build.sh
start: ROBONIX_WORLD_FORCE=native bash scripts/start.sh

capabilities:
  - name: robonix/system/world/list_objects
  - name: robonix/system/world/get_robot_context
  - name: robonix/system/world/list_regions
  - name: robonix/system/world/goal_near
  - name: robonix/system/world/goal_room
  - name: robonix/system/world/get_scene_graph
  - name: robonix/system/world/get_object_context
  - name: robonix/system/world/list_relations
