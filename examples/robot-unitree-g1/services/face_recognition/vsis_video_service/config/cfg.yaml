# 单独运行 VSIS 时的回退配置。通过 Robonix 启动时以 robonix_manifest.yaml
# service.face_recognition.config 为准，本文件不参与托管服务的运行配置。
# 日志
log:
  mode: 2     # 0=仅控制台 1=仅文件 2=控制台+文件
  level: 1    # 0=trace 1=debug 2=info 3=warn 4=err 5=critical

# 视频采集 (M2)
video:
  # rtsp://、http://、https:// → FFmpeg 网络拉流; 设备号或 /dev/videoN → V4L2
  # source: "rtsp://192.168.123.164:8554/camera"
  source: "http://192.168.123.164:18081/stream?topic=/face/camera/color/image_raw"
  # source: "http://192.168.1.10:8080/video.mjpg"
  # source: "https://camera.example.com/live.mjpg"
  # source: "/dev/video0"
  reconnect_interval_ms: 3000   # 断流后重连间隔
  width: 1280                   # V4L2 请求分辨率 (网络流忽略; 0=相机默认)
  height: 720

face:
  search_threshold: 0.45     # 识别判定线，只许 0.45~0.5
  greet_cooldown_sec: 30
  max_faces: 5
  confirm_hits: 1
  absent_sec: 3             # 离场判定秒数：超过该时长未见同一 id 则视为重新入场
  intimacy_upgrade_encounters: [5, 15, 30, 60]  # 累计见面次数达到时依次升至 2/3/4/5 级

audio:
  host: "127.0.0.1"
  port: 10086
  
