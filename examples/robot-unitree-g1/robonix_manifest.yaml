manifestVersion: 1
name: robonix-g1-deploy

catalog:
  name: robonix.robot.unitree.g1
  version: 0.1.0
  description: Robonix deployment for the Unitree G1 humanoid robot with Mid-360 LiDAR, RealSense D435i depth camera, and SDK2 locomotion control.
  license: Apache-2.0
  tags: [robot, deploy, unitree, g1, humanoid, lidar, rgbd, arm, locomotion, sdk2]
  maintainers:
    - Origamii520 <zxq13204030517@163.com>

env:
  # Deployment root — "." when running locally (no external deploy dir).
  ROBONIX_DEPLOY_DIR: "/data/robonix/examples/robot-unitree-g1"
  # Shared local facts; unset in other deployments to retain their behavior.
  ROBONIX_GREETING_STATE_PATH: ${ROBONIX_DEPLOY_DIR}/data/greeting_state.json

  RMW_IMPLEMENTATION: rmw_fastrtps_cpp

  # G1 network interface (usually the ethernet port to the robot)
  G1_NETWORK_INTERFACE: "enp7s0"

  # Motion gate — set to false for read-only / operator-supervised mode
  G1_ALLOW_MOTION: "true"
  G1_ARM_ACTIONS_ENABLED: "true"
  G1_ARM_ACTION_ACK: "G1_ARM_ACTIONS_APPROVED"

  # Mapping directory
  MAPPING_MAPS_DIR: /data/robonix/examples/robot-unitree-g1/third_party/service-map-rbnx/rbnx-build/data/maps

  # World data directories
  WORLD_OBJECT_MEMORY_DB: ${ROBONIX_DEPLOY_DIR}/rbnx-build/data/scene/objects.db
  WORLD_GRAPH_CACHE_DIR: ${ROBONIX_DEPLOY_DIR}/rbnx-build/data/scene/graph
  WORLD_ANNOTATIONS_DIR: ${ROBONIX_DEPLOY_DIR}/rbnx-build/data/scene/annotations

  # Hosts — bind to 127.0.0.1 when the robot has a separate control network;
  # change to 0.0.0.0 when running on a Jetson attached to the operator network.
  ROBONIX_PROVIDER_BIND_HOST: 127.0.0.1
  ROBONIX_ADVERTISE_HOST: 127.0.0.1
  MAPPING_WEBUI_HOST: 127.0.0.1
  WORLD_WEB_HOST: 127.0.0.1

  ROBONIX_WORLD_ROS_DISTRO: humble

  # The G1 is CPU-only (no NVIDIA GPU in the torso). Force CPU backends
  # for World and any inference pipelines.
  ROBONIX_FORCE_CPU: "0"
  WORLD_CG_FORCE_CPU: "0"

  WORLD_MAP_ID: "${G1_MAP_ID}"

  # Speech backend — local FunASR or cloud Tencent ASR
  SPEECH_BACKEND: "${SPEECH_BACKEND}"

  # Cache directories inside the deployment so model weights never touch
  # a global user home that would be absent from the deployable artifact.
  XDG_CACHE_HOME: ${ROBONIX_DEPLOY_DIR}/.cache/xdg
  MODELSCOPE_CACHE: ${ROBONIX_DEPLOY_DIR}/.cache/modelscope
  MODELSCOPE_CREDENTIALS_PATH: ${ROBONIX_DEPLOY_DIR}/.cache/modelscope/credentials
  HF_HOME: ${ROBONIX_DEPLOY_DIR}/.cache/huggingface
  TORCH_HOME: ${ROBONIX_DEPLOY_DIR}/.cache/torch

  # Dashboard port
  G1_DASHBOARD_PORT: "28080"

  # VLM endpoint (for planner / World)
  VLM_BASE_URL: "${VLM_BASE_URL}"
  VLM_API_KEY: "${VLM_API_KEY}"
  VLM_MODEL: "${VLM_MODEL}"

system:
  src: {listen: 0.0.0.0:50051, log: info}
  executor: {listen: 0.0.0.0:50061, log: info}
  planner:
    listen: 0.0.0.0:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  gateway: {listen: 0.0.0.0:50081, log: info}
  robotdesc:
    listen: 0.0.0.0:50091
    provider_id: robotdesc
    robot_yaml: ${ROBONIX_DEPLOY_DIR}/robotdesc.yaml
    log: info
  world:
    log: info
    web_host: 0.0.0.0
    web_port: 50107
    sensor_providers:
      rgb: realsense_camera
      depth: realsense_camera
      intrinsics: realsense_camera
      camera_extrinsics: realsense_camera
    # Valid detection rounds missing an in-view, unobstructed object before removal.
    WORLD_CG_MISSING_DETECTIONS: 3

primitive:
  # ============================================================
  # Chassis — wraps the Unitree SDK2 LocoClient RPC API (sport service)
  # for high-level bipedal locomotion: FSM state machine (stand /
  # balance / damp / squat), velocity walk commands, and height /
  # swing parameters.  Internally subscribes to rt/lowstate for
  # odometry and joint-state feedback.
  # ============================================================
  - name: g1_chassis
    path: ${ROBONIX_DEPLOY_DIR}/packages/g1_chassis
    config:
      twist_in_topic: /cmd_vel
      odom_topic: /odom
      odom_source: sdk_pose
      state_topic: rt/odommodestate
      odom_publish_rate_hz: 50.0
      state_timeout_s: 0.15
      publish_odom_tf: true
      joint_state_topic: /joint_states
      odom_frame: odom
      base_frame: base_footprint
      imu_frame: imu
      velocity_frame: odom
      network_interface: ${G1_NETWORK_INTERFACE}
      allow_motion: ${G1_ALLOW_MOTION}
      # Loco API parameters
      stand_height: 0.55
      swing_height: 0.08
      # Conservative navigation envelope; raise only after TF/scan timing
      # and walking stability are confirmed on hardware.
      max_linear_x_mps: 0.35
      max_linear_y_mps: 0.20
      max_angular_z_rps: 0.60
      max_linear_accel_mps2: 0.6
      max_angular_accel_rps2: 1.0
      command_timeout_s: 0.5
    

  # ============================================================
  # Arm — guarded SDK2 preset upper-arm actions exposed over gRPC.
  # Disabled unless G1_ARM_ACTIONS_ENABLED=true and the exact
  # acknowledgement string is provided.
  # ============================================================
  - name: g1_arm
    path: ${ROBONIX_DEPLOY_DIR}/packages/g1_arm
    config:
      network_interface: ${G1_NETWORK_INTERFACE}
      allow_actions: ${G1_ARM_ACTIONS_ENABLED}
      action_ack: ${G1_ARM_ACTION_ACK}
      action_timeout_s: 15.0

  # ============================================================
  # Sensors — Livox Mid-360 LiDAR / IMU (read via UDP directly from
  # the head-mounted sensor) + Intel RealSense D435i depth camera.
  # Follows the same pattern as the ranger_mini_v3 manifest.
  # ============================================================
  - name: mid360_lidar
    path: ${ROBONIX_DEPLOY_DIR}/primitives/primitive-livox-mid360-lidar-rbnx
    config:
      lidar_ip: 192.168.123.120
      host_ip: 192.168.123.100
      xfer_format: 0
      frame_id: mid360_upright
      # Three attempts including cleanup stay below Robotdesc's 90 s INIT deadline.
      sentinel_timeout_s: 20.0

  - name: mid360_imu
    url: https://github.com/syswonder/primitive-livox-mid360-imu-rbnx
    branch: main
    config:
      imu_topic: /livox/imu
      sentinel_timeout_s: 45.0

  - name: realsense_camera
    path: ${ROBONIX_DEPLOY_DIR}/primitives/primitive-intel-realsense_d435i-camera-rbnx
    config:
      # The camera is published by an external ROS 2 node/machine; do not
      # start a local librealsense USB driver on this host.
      external_topics: true
      camera_name: camera
      launch_realsense: false
      base_frame_id: d435_link
      publish_camera_mount_tf: true
      camera_mount_parent_frame: d435_link
      camera_mount_child_frame: camera_link
      camera_mount_x: 0.0
      camera_mount_y: 0.0
      camera_mount_z: 0.0
      camera_mount_roll: 0.0
      camera_mount_pitch: 0.0
      camera_mount_yaw: 0.0
      extrinsics_topic: /camera/extrinsics
      extrinsics_base_frame: base_footprint
      extrinsics_camera_frame: camera_color_optical_frame
      rgb_topic: /camera/color/image_raw
      depth_topic: /camera/aligned_depth_to_color/image_raw
      intrinsics_topic: /camera/color/camera_info
      enable_imu: false
      sentinel_timeout_s: 45.0

  - name: face_camera
    path: ${ROBONIX_DEPLOY_DIR}/primitives/primitive-unitree-g1-face-camera-rgb-rbnx
    config:
      rgb_topic: /face/camera/color/image_raw
      sentinel_timeout_s: 30.0


  # ============================================================
  # Robot description — publishes /robot_description and the TF tree.
  # ============================================================
  - name: robot_description
    url: https://github.com/syswonder/primitive-robot-description-rbnx
    branch: main
    manifest: package_manifest.native.yaml


  # ============================================================
  # G1 speaker — Unitree SDK2 audio output, used by the speech service.
  # ============================================================
  - name: g1_audio
    path: ${ROBONIX_DEPLOY_DIR}/primitives/g1_audio
    config:
      network_interface: ${G1_NETWORK_INTERFACE}
      max_audio_bytes: 33554432
      startup_timeout_s: 15.0
      mic_multicast_group: 239.168.123.161
      mic_multicast_port: 5555
      mic_bind_address: 192.168.123.220
      mic_sample_rate: 16000
      mic_channels: 1
      mic_bits_per_sample: 16
      mic_max_packet_bytes: 65535
      mic_socket_timeout_s: 0.5


  # ============================================================
  # Audio client bridge — optional browser/client audio relay.
  # ============================================================
  - name: audio_client_bridge
    url: https://github.com/syswonder/primitive-audio-client-bridge-rbnx
    branch: main
    config:
      transport: reverse
      listen_host: 0.0.0.0
      listen_port: 60002

service:
  # ============================================================
  # Mapping — RTAB-Map 3D mapping with Mid-360 LiDAR + depth fusion.
  # ============================================================
  - name: mapping
    path: ${ROBONIX_DEPLOY_DIR}/services/service-map-rbnx
    config:
      algo: rtabmap
      base_frame: base_footprint
      odom_frame: odom
      use_sim_time: false
      webui_host: 127.0.0.1
      webui_port: 8091
      map_id: "${G1_MAP_ID}"
      map_mode: mapping
      gravity_alignment: true
      imu_acceleration_scale: 9.80665
      deskew_lidar: false
      dense_scan_2d: true
      dense_scan_refine_neighbors: true
      params_file: config/rtabmap_params.yaml
      rtabmap_params:
        Reg/Strategy: 1
        Reg/Force3DoF: false
        # NeighborLinkRefining and ICP motion limits come from params_file.
        # Keep refinement off for raw clouds; 0.10 motion limits caused ICP
        # rejection and stalled odom TF during the G1 run.
        RGBD/ProximityBySpace: false
        RGBD/ProximityPathMaxNeighbors: 0
        Icp/PointToPlane: true
        Icp/PointToPlaneMinComplexity: 0.02
        Icp/PointToPlaneLowComplexityStrategy: 1
      rtabmap_inputs: [lidar, imu, odom]
      sensor_providers:
        lidar3d: mid360_lidar
        imu: mid360_imu
        odom: g1_chassis
        # rgb: realsense_camera
        # depth: realsense_camera

  # ============================================================
  # Navigation 2 — bipedal-safe Nav2 with height-aware scan projection
  # (tall legs and torso clearance require adjusted min/max heights).
  # ============================================================
  - name: nav2
    path: ${ROBONIX_DEPLOY_DIR}/services/service-navigation-rbnx
    config:
      # params_file: config/nav2_params_g1.yaml
      params_file: config/nav2_params_g1_python.yaml
      bt_xml_file: config/navigate.xml
      bt_through_poses_xml_file: config/navigate_through_poses.xml
      velocity_output_topic: /cmd_vel
      use_sim_time: false
      action_wait_s: 90.0
      topic_remap:
        odom: /odom
      provider_ids:
        odom: g1_chassis
        map: mapping
        scan_cloud: mid360_lidar
      scan_projection:
        enabled: true
        target_frame: base_footprint
        # Height above the nominal sole plane; exclude floor returns.
        min_height_m: 0.15
        max_height_m: 1.50
        range_max_m: 12.0
        self_filter_margin_m: 0.05
        transform_tolerance_s: 1.00
        # The current odom TF publisher is a few milliseconds behind the
        # point-cloud end timestamp. RTAB-Map then falls back to a skewed
        # cloud and pointcloud_to_laserscan develops gaps. Follow the working
        # g1_slam path and project the live cloud without deskewing.
        deskewing: false
        deskew_fixed_frame: odom
        deskew_wait_for_transform_s: 1.00
      scan_timeout_s: 1.5
      # G1 walks slower than a wheeled robot; tune stuck detection.
      # Match Nav2 arrival tolerance; terminal drift still has a wider stop bound.
      guard_terminal_xy_m: 0.60
      guard_terminal_timeout_s: 60.0
      guard_no_progress_s: 8.0
      guard_global_spin_timeout_s: 45.0
      guard_global_spin_limit_rad: 4.20
      dynamic_speed:
        max_linear_speed_mps: 0.35
        default_percentage: 100

  # ============================================================
  # Speech — wake-word detection and text-to-speech.
  # ============================================================
  - name: speech
    path: ${ROBONIX_SOURCE_PATH}/services/speech
    config:
      speech_backend: "${SPEECH_BACKEND}"
      speech_tts_backend_class: speech_service.unitree_tts:UnitreeTTSBackend
      disable_whisper: true
      tts_voice: zh-CN-XiaoxiaoNeural
      default_speaker_provider_id: g1_audio
  #     wake_words: ["罗伯尼克斯", "罗伯特"]
  
  # - name: camera_rtsp
  #   path: ../scout2/services/camera_rtsp
  #   config:
  #     camera_provider_id: face_camera
  #     rtsp_url: rtsp://127.0.0.1:8554/camera
  #     manage_server: true
  #     fps: 15
  #     startup_timeout: 25
  #     frame_timeout: 5

  - name: face_recognition
    path: ./services/face_recognition
    config:
      # Use the VSIS project bundled in this service package.
      startup_timeout: 45
      log:
        mode: 2
        level: 1
      video:
        source: "http://192.168.123.164:18081/stream?topic=/face/camera/color/image_raw"
        reconnect_interval_ms: 3000
        width: 1280
        height: 720
      face:
        search_threshold: 0.45
        greet_cooldown_sec: 30
        max_faces: 5
        confirm_hits: 1
        absent_sec: 3
        # Levels 2, 3, 4, 5; one count per confirmed, distinct encounter.
        intimacy_upgrade_encounters: [2, 5, 10, 20]
      audio:
        host: 127.0.0.1
        port: 10086


  # - name: g1_dashboard
  #   path: ${ROBONIX_DEPLOY_DIR}/packages/g1_dashboard
  #   config:
  #     host: 127.0.0.1
  #     port: ${G1_DASHBOARD_PORT}
  #     camera_topic: /camera/color/image_raw
  #     d435i_depth_topic: /camera/aligned_depth_to_color/image_raw
