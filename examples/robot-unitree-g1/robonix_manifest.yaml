  #     base_frame: base_link
  #     browser_voice_enabled: "0"
  #     gateway_endpoint: 127.0.0.1:50081
  #     audio_bridge_url: ws://127.0.0.1:60002/client
  #     browser_mic_provider: audio_client_bridge

skill:
  - name: g1_arm_actions
    path: ${ROBONIX_DEPLOY_DIR}/packages/g1_arm_actions
    activate_on_boot: true
    config:
      arm_provider_id: g1_arm
      rpc_timeout_s: 15.0

  - name: g1_face_greeting
    path: ${ROBONIX_DEPLOY_DIR}/skills/g1_face_greeting
    activate_on_boot: true
    config:
      face_provider_id: face_recognition
      world_provider_id: world
      speech_provider_id: speech
      arm_provider_id: g1_arm_actions
      navigation_provider_id: nav2
      greeting_wait_sec: 12
      navigation_enabled: true
      turn_to_face_enabled: false
      poll_wait_ms: 1000
      cooldown_sec: 30
      message_store_path: ${ROBONIX_DEPLOY_DIR}/data/face_messages.sqlite3
      action_level_1: wave_under_head
      action_level_2: wave_under_head
      action_level_3: wave_above_head
      action_level_4: make_heart_with_right_hand
      action_level_5: make_heart_with_both_hands

